name: Draft PR body for dependency updates
description: Generate PR body from go.mod and frontend/package.json diffs (hoisted from weekly-update).
author: Delnegend

inputs:
  go-mod-path:
    description: Path to go.mod diff
    required: false
    default: 'go.mod'
  frontend-package-json-path:
    description: Path to frontend package.json diff
    required: false
    default: 'frontend/package.json'

outputs:
  body:
    description: Generated PR body markdown
    value: ${{ steps.draft.outputs.body }}

runs:
  using: composite
  steps:
    - name: Draft PR body
      id: draft
      shell: bash
      run: |
        set -e
        {
          echo "## Dependency changes"
          echo ""
          echo "### Go dependencies"
          git diff -- "${{ inputs.go-mod-path }}" | awk '
            /^[+-][[:space:]]+[^ ]+ v[0-9]/ {
              sign = substr($0, 1, 1); mod = $2; ver = $3
              if (sign == "-") old[mod] = ver; else new[mod] = ver
            }
            END {
              for (m in old) printf "- %s: %s -> %s\n", m, old[m], (new[m] ? new[m] : "removed")
              for (m in new) if (!(m in old)) printf "- %s: added %s\n", m, new[m]
            }' | sort
          echo ""
          echo "### Frontend dependencies"
          git diff -- "${{ inputs.frontend-package-json-path }}" | awk -F'[:", ]+' '
            /^[+-][[:space:]]+"[^"]+": "[^"]+"/ {
              sign = substr($1, 1, 1); pkg = $2; ver = $3
              if (sign == "-") old[pkg] = ver; else new[pkg] = ver
            }
            END {
              for (p in old) printf "- %s: %s -> %s\n", p, old[p], (new[p] ? new[p] : "removed")
              for (p in new) if (!(p in old)) printf "- %s: added %s\n", p, new[p]
            }' | sort
          echo ""
          echo "Generated by the weekly dependency-update workflow. Frontend and backend builds were validated against these changes."
        } > /tmp/pr-body.md
        {
          echo "body<<EOF"
          cat /tmp/pr-body.md
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "Drafted PR body:"
        cat /tmp/pr-body.md

branding:
  icon: file-text
  color: blue
