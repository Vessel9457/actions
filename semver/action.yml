name: semver
description: Calculate the next release version based on Conventional Commits since the latest git tag

inputs:
  path:
    description: Working directory / path to git repository
    required: false
    default: .
  prefix:
    description: Prefix for version tags (e.g. 'v')
    required: false
    default: v
  fallback_version:
    description: Fallback SemVer version if no tags are found in the repository
    required: false
    default: 0.1.0
  no_version_bump_behavior:
    description: Bump behavior when commits exist but none trigger a major/minor bump (patch, current, none)
    required: false
    default: patch

outputs:
  current:
    description: Latest tag/version found (e.g. 'v0.1.0')
  current_strict:
    description: Latest version without prefix (e.g. '0.1.0')
  next:
    description: Next calculated version with prefix (e.g. 'v0.2.0')
  next_strict:
    description: Next calculated version without prefix (e.g. '0.2.0')
  major:
    description: Next major version number
  minor:
    description: Next minor version number
  patch:
    description: Next patch version number
  bump:
    description: Type of bump applied (major, minor, patch, none)
  skip:
    description: 'true' if no new commits exist since latest tag or bump is none
  commits_count:
    description: Number of commits evaluated since the latest tag

runs:
  using: composite
  steps:
    - name: Calculate SemVer
      shell: bash
      env:
        TARGET_PATH: ${{ inputs.path }}
        PREFIX: ${{ inputs.prefix }}
        FALLBACK_VERSION: ${{ inputs.fallback_version }}
        NO_BUMP_BEHAVIOR: ${{ inputs.no_version_bump_behavior }}
      run: |
        set -euo pipefail

        cd "$TARGET_PATH"

        # Fetch tags in case the workspace is a shallow clone
        git fetch --tags --quiet 2>/dev/null || true

        # Find latest tag matching prefix sorted by version
        LATEST_TAG="$(git tag -l "${PREFIX}[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n1 || true)"

        if [ -z "$LATEST_TAG" ]; then
          CURRENT_VERSION="${FALLBACK_VERSION#${PREFIX}}"
          CURRENT_TAG="${PREFIX}${CURRENT_VERSION}"
          RANGE="HEAD"
        else
          CURRENT_TAG="$LATEST_TAG"
          CURRENT_VERSION="${LATEST_TAG#${PREFIX}}"
          RANGE="${CURRENT_TAG}..HEAD"
        fi

        echo "Current tag: $CURRENT_TAG ($CURRENT_VERSION)"

        COUNT="$(git rev-list --count "$RANGE" 2>/dev/null || echo 0)"
        echo "Commits since $CURRENT_TAG: $COUNT"

        if [ "$COUNT" -eq 0 ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "current_strict=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "next=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "next_strict=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$(echo "$CURRENT_VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$CURRENT_VERSION" | cut -d. -f2)" >> "$GITHUB_OUTPUT"
          echo "patch=$(echo "$CURRENT_VERSION" | cut -d. -f3 | cut -d- -f1)" >> "$GITHUB_OUTPUT"
          echo "bump=none" >> "$GITHUB_OUTPUT"
          echo "commits_count=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        HAS_MAJOR=false
        HAS_MINOR=false
        HAS_PATCH=false

        while IFS= read -r commit_hash; do
          [ -n "$commit_hash" ] || continue
          SUBJECT="$(git log -1 --format=%s "$commit_hash")"
          BODY="$(git log -1 --format=%b "$commit_hash")"

          # 1. Breaking changes (Major):
          #    - Subject with exclamation: "type!:", "type(scope)!:"
          #    - Body with "BREAKING CHANGE:" or "BREAKING-CHANGE:"
          if echo "$SUBJECT" | grep -qE "^[a-zA-Z0-9_]+(\([^)]+\))?!:" || echo "$BODY" | grep -qE "^BREAKING[- ]CHANGE:"; then
            HAS_MAJOR=true
            break
          # 2. Features (Minor): "feat:", "feat(scope):", "feature:", "feature(scope):"
          elif echo "$SUBJECT" | grep -qE "^(feat|feature)(\([^)]+\))?:"; then
            HAS_MINOR=true
          # 3. Fixes and improvements (Patch): "fix:", "perf:", "refactor:", "test:", "tests:", etc.
          elif echo "$SUBJECT" | grep -qE "^(fix|bugfix|perf|refactor|test|tests)(\([^)]+\))?:"; then
            HAS_PATCH=true
          fi
        done < <(git rev-list "$RANGE")

        BUMP="none"
        if [ "$HAS_MAJOR" = "true" ]; then
          BUMP="major"
        elif [ "$HAS_MINOR" = "true" ]; then
          BUMP="minor"
        elif [ "$HAS_PATCH" = "true" ]; then
          BUMP="patch"
        elif [ "$COUNT" -gt 0 ] && [ "$NO_BUMP_BEHAVIOR" = "patch" ]; then
          BUMP="patch"
        fi

        MAJOR="$(echo "$CURRENT_VERSION" | cut -d. -f1)"
        MINOR="$(echo "$CURRENT_VERSION" | cut -d. -f2)"
        PATCH="$(echo "$CURRENT_VERSION" | cut -d. -f3 | cut -d- -f1)"

        case "$BUMP" in
          major)
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            ;;
          minor)
            MINOR=$((MINOR + 1))
            PATCH=0
            ;;
          patch)
            PATCH=$((PATCH + 1))
            ;;
          none)
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "current=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
            echo "current_strict=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            echo "next=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
            echo "next_strict=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
            echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
            echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
            echo "bump=none" >> "$GITHUB_OUTPUT"
            echo "commits_count=$COUNT" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac

        NEXT_STRICT="${MAJOR}.${MINOR}.${PATCH}"
        NEXT_TAG="${PREFIX}${NEXT_STRICT}"

        echo "Bump: $BUMP ($CURRENT_VERSION -> $NEXT_STRICT)"

        echo "skip=false" >> "$GITHUB_OUTPUT"
        echo "current=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
        echo "current_strict=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
        echo "next=$NEXT_TAG" >> "$GITHUB_OUTPUT"
        echo "next_strict=$NEXT_STRICT" >> "$GITHUB_OUTPUT"
        echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
        echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
        echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
        echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
        echo "commits_count=$COUNT" >> "$GITHUB_OUTPUT"
