name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Full matrix on PR — weekly cadence, so cost is acceptable
# Mirrors release.yml build steps but without packaging/release

jobs:
  check:
    name: Check (just check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Run checks
        run: just check

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux/amd64
          - os: macos-latest
            goos: darwin
            goarch: universal
            platform: darwin/universal
          - os: windows-latest
            goos: windows
            goarch: amd64
            platform: windows/amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Install NSIS (Windows)
        if: matrix.goos == 'windows'
        run: choco install nsis -y
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build Wails App (Linux)
        if: matrix.goos == 'linux'
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -platform ${{ matrix.platform }} -clean -tags webkit2_41
      - name: Build Wails App (macOS)
        if: matrix.goos == 'darwin'
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -platform ${{ matrix.platform }} -clean
      - name: Build Wails App (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -platform ${{ matrix.platform }} -nsis -clean
