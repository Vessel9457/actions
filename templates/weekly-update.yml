name: Weekly Update

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BUN_MIN_RELEASE_AGE: 1209600 # 2 weeks in seconds (14 days)
  GO_MIN_RELEASE_AGE: 1209600 # 2 weeks in seconds (14 days)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Update dependencies
        run: |
          # Go dependencies with minimum release age (2 weeks)
          echo "Updating Go dependencies (min age: ${{ env.GO_MIN_RELEASE_AGE }}s)..."
          GO_MIN_AGE=${{ env.GO_MIN_RELEASE_AGE }}
          CUTOFF_EPOCH=$(($(date +%s) - GO_MIN_AGE))
          echo "Cutoff date: $(date -u -d "@$CUTOFF_EPOCH" --iso-8601=seconds 2>/dev/null || date -u -r "$CUTOFF_EPOCH" +%Y-%m-%dT%H:%M:%SZ)"

          UPDATABLE=$(go list -m -u all 2>/dev/null | awk '$3 ~ /^\[v.*\]$/ {print $1, $2, substr($3,2,length($3)-2)}' || true)
          if [ -z "$UPDATABLE" ]; then
            echo "No Go updates available"
          else
            echo "Modules with updates:"
            echo "$UPDATABLE"
            TO_UPDATE=""
            while read -r mod cur latest; do
              [ -z "$mod" ] && continue
              echo "Checking $mod $cur -> $latest ..."
              # proxy.golang.org requires lowercased module path
              MOD_LOWER=$(echo "$mod" | tr '[:upper:]' '[:lower:]')
              INFO_URL="https://proxy.golang.org/${MOD_LOWER}/@v/${latest}.info"
              INFO=$(curl -sf "$INFO_URL" 2>/dev/null || echo "")
              if [ -z "$INFO" ]; then
                echo "  -> could not fetch info from $INFO_URL, skipping"
                continue
              fi
              TIME_STR=$(echo "$INFO" | grep -o '"Time":"[^"]*"' | cut -d'"' -f4 || true)
              if [ -z "$TIME_STR" ]; then
                echo "  -> no Time field, skipping"
                continue
              fi
              VER_EPOCH=$(date -d "$TIME_STR" +%s 2>/dev/null || echo 0)
              if [ "$VER_EPOCH" -eq 0 ]; then
                echo "  -> could not parse time $TIME_STR, skipping"
                continue
              fi
              AGE=$(( $(date +%s) - VER_EPOCH ))
              AGE_DAYS=$(( AGE / 86400 ))
              if [ "$VER_EPOCH" -le "$CUTOFF_EPOCH" ]; then
                echo "  -> OK (age ${AGE_DAYS}d, released $TIME_STR) - will update"
                TO_UPDATE="$TO_UPDATE $mod@$latest"
              else
                echo "  -> SKIP (age ${AGE_DAYS}d, released $TIME_STR) - too recent (<2 weeks)"
              fi
            done <<< "$UPDATABLE"

            if [ -n "$TO_UPDATE" ]; then
              echo "Updating:$TO_UPDATE"
              # shellcheck disable=SC2086
              go get $TO_UPDATE
            else
              echo "No Go modules passed min-age filter"
            fi
          fi
          go mod tidy

          # Frontend dependencies with minimum release age (2 weeks)
          # Hold: typescript is aliased to TS6 for vue-tsc until TS 7.1 ships stable API
          # (vuejs/language-tools#6124, https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/#typescript-and-embedded-languages)
          # Overrides in frontend/package.json + renovate.json cap it at <7; verify after update.
          cd frontend
          bun update --latest --minimum-release-age ${{ env.BUN_MIN_RELEASE_AGE }}

          echo "Verifying typescript hold (should remain aliased to TS6)..."
          if ! grep -q '"typescript": "npm:@typescript/typescript6' package.json; then
            echo "::warning::typescript hold violated — package.json no longer aliased to TS6 after bun update. Restoring..."
            echo "Current: $(grep '"typescript"' package.json)"
            echo "This should have been capped by overrides (package.json:overrides) and renovate.json."
            echo "For safety, workflow will fail here to avoid opening a broken PR."
            echo "Fix: ensure overrides and renovate rule are intact, or re-pin to npm:@typescript/typescript6@6.0.2"
            exit 1
          fi
          echo "Hold OK: $(grep '"typescript"' package.json | head -1)"

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      # Local build validation — always run, but don't block PR creation.
      # PR's full-matrix CI (ci.yml) is the merge gate; this is just early feedback.
      - name: Build frontend (local gate)
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        id: local-frontend
        run: |
          cd frontend
          bun install
          bun run build

      - name: Validate Go build (local gate)
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        id: local-go
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
          go build -tags webkit2_41 ./...

      - name: Build gate — local checks (just check)
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        id: local-check
        run: |
          echo "Build gate: running just check (go fmt+vet, oxlint, prettier)..."
          if command -v just >/dev/null 2>&1; then
            just check
          else
            echo "just not found, running checks directly..."
            go vet ./...
            test -z "$(gofmt -l .)"
            (cd frontend && bun x oxlint --import-plugin -D correctness -D perf --ignore-pattern wailsjs/**/*.* && bun x prettier --check "**/*.{js,ts,vue,json,css}")
          fi
          echo "Local checks done — PR will be opened and full-matrix CI will gate merge."

      - name: Draft PR body from the dependency diff
        id: prbody
        if: always() && steps.changes.outputs.changed == 'true'
        run: |
          {
            echo "## Dependency changes"
            echo ""
            echo "### Go dependencies"
            git diff -- go.mod | awk '
              /^[+-][[:space:]]+[^ ]+ v[0-9]/ {
                sign = substr($0, 1, 1); mod = $2; ver = $3
                if (sign == "-") old[mod] = ver; else new[mod] = ver
              }
              END {
                for (m in old) printf "- %s: %s -> %s\n", m, old[m], (new[m] ? new[m] : "removed")
                for (m in new) if (!(m in old)) printf "- %s: added %s\n", m, new[m]
              }' | sort
            echo ""
            echo "### Frontend dependencies"
            git diff -- frontend/package.json | awk -F'[:", ]+' '
              /^[+-][[:space:]]+"[^"]+": "[^"]+"/ {
                sign = substr($1, 1, 1); pkg = $2; ver = $3
                if (sign == "-") old[pkg] = ver; else new[pkg] = ver
              }
              END {
                for (p in old) printf "- %s: %s -> %s\n", p, old[p], (new[p] ? new[p] : "removed")
                for (p in new) if (!(m in old)) printf "- %s: added %s\n", p, new[p]
              }' | sort
            echo ""
            echo "Generated by the weekly dependency-update workflow. Frontend and backend builds were validated against these changes."
          } > /tmp/pr-body.md
          {
            echo "body<<EOF"
            cat /tmp/pr-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open PR for review
        if: always() && steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): weekly dependency update'
          title: 'chore(deps): weekly dependency update'
          body: ${{ steps.prbody.outputs.body }}
          branch: chore/update-deps
          delete-branch: true
          labels: dependencies
